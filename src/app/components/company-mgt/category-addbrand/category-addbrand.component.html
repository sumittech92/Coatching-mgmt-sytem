<h2 mat-dialog-title class="dialog-title">{{isEdit ? 'Edit brand' : 'Add brand'}}</h2><p class="dialog-subtitle">Add the brand name, its department and an optional logo.</p>
<mat-dialog-content class="dialog-content"><form [formGroup]="form" class="row g-2" (ngSubmit)="save()">
  <div class="col-md-6"><label class="field-label">Brand name *</label><mat-form-field appearance="outline" class="w-100"><input matInput formControlName="name" placeholder="e.g. Atelier Basics" maxlength="60"><mat-error>{{errorFor('name', 'Brand name')}}</mat-error></mat-form-field></div>
  <div class="col-md-6"><label class="field-label">Parent department</label><mat-form-field appearance="outline" class="w-100"><mat-select formControlName="department"><mat-option value="">None</mat-option><mat-option *ngFor="let d of departments" [value]="d">{{d}}</mat-option></mat-select></mat-form-field></div>
  <div class="col-12 mb-3"><label class="field-label">Brand logo</label>
    <div class="upload-box" *ngIf="!previewUrl" (click)="fileInput.click()" role="button" tabindex="0" (keydown.enter)="fileInput.click()"><mat-icon>cloud_upload</mat-icon>Upload image · PNG, JPG or SVG up to {{maxImageMb}} MB</div>
    <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" hidden>
    <div class="preview-box" *ngIf="previewUrl"><img [src]="previewUrl" alt="Brand logo preview"><button type="button" mat-stroked-button (click)="fileInput.click()">Replace</button><button type="button" mat-button color="warn" (click)="removeImage()">Remove</button></div>
  </div>
  <div class="col-12"><label class="field-label">Description</label><mat-form-field appearance="outline" class="w-100"><textarea matInput formControlName="description" placeholder="Short description (optional)" rows="4" maxlength="500"></textarea><mat-hint align="end">{{form.value.description?.length || 0}}/500</mat-hint><mat-error>{{errorFor('description', 'Description')}}</mat-error></mat-form-field></div>
  <button type="submit" hidden></button>
</form></mat-dialog-content>
<mat-dialog-actions class="dialog-actions" align="end"><button mat-button mat-dialog-close>Cancel</button><button mat-flat-button color="primary" (click)="save()">{{isEdit ? 'Save changes' : 'Add brand'}}</button></mat-dialog-actions>
