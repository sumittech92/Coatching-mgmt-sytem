<nav class="bottom-nav" aria-label="Quick navigation">
  <a *ngFor="let item of items" class="bottom-nav-item" [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }" #link="routerLinkActive" [attr.aria-current]="link.isActive ? 'page' : null">
    <span class="bottom-nav-icon"><mat-icon fontSet="material-icons-outlined">{{ item.icon }}</mat-icon><i class="bottom-nav-dot" *ngIf="item.dot"></i></span>
    <span class="bottom-nav-label">{{ item.label }}</span>
  </a>
  <button type="button" class="bottom-nav-item" [class.active]="moreActive" (click)="more.emit()" aria-label="More menu" [attr.aria-expanded]="moreActive">
    <span class="bottom-nav-icon"><mat-icon fontSet="material-icons-outlined">more_horiz</mat-icon></span>
    <span class="bottom-nav-label">More</span>
  </button>
</nav>
