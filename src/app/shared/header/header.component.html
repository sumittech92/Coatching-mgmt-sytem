<header class="top-header">
  <div class="header-left"><button mat-icon-button class="mobile-menu" aria-label="Open navigation" (click)="toggleSidebar()"><mat-icon>menu</mat-icon></button><app-breadcrumbs [items]="breadcrumbs"></app-breadcrumbs></div>
  <div class="header-actions"><button mat-icon-button class="header-icon" aria-label="Search"><mat-icon>search</mat-icon></button><button mat-icon-button class="header-icon notification-button" aria-label="Notifications" [matMenuTriggerFor]="notifications"><mat-icon matBadge="3" matBadgeColor="warn" matBadgeSize="small">notifications_none</mat-icon></button><mat-menu #notifications="matMenu"><div class="notification-heading">Notifications <small>3 new</small></div><button mat-menu-item><mat-icon>person_add</mat-icon><span>3 new student admissions</span></button><button mat-menu-item><mat-icon>payments</mat-icon><span>Fee reminder due today</span></button><button mat-menu-item><mat-icon>campaign</mat-icon><span>Post published successfully</span></button></mat-menu><span class="header-divider"></span><button mat-button class="profile-box" [matMenuTriggerFor]="UserProfile"><span class="avatar">{{initials}}</span><span class="profile-meta"><strong>{{displayName}}</strong><small>{{roleLabel}}</small></span><mat-icon class="profile-chevron">expand_more</mat-icon></button><mat-menu #UserProfile="matMenu"><button mat-menu-item [routerLink]="profilePath"><mat-icon>person_outline</mat-icon>My profile</button><button mat-menu-item [routerLink]="profilePath"><mat-icon>lock_reset</mat-icon>Change password</button><button mat-menu-item *ngIf="settingsPath" [routerLink]="settingsPath"><mat-icon>settings</mat-icon>Settings</button><mat-divider></mat-divider><button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon>Log out</button></mat-menu></div>
</header>
