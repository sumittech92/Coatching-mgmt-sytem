<h2 mat-dialog-title class="dialog-title">{{data.title}}</h2><p class="dialog-subtitle">Enter the details below. This demo saves changes locally in your browser session.</p><mat-dialog-content class="dialog-content"><form [formGroup]="form" class="row g-2"><div *ngFor="let field of data.fields" [ngClass]="field.type === 'textarea' ? 'col-12' : 'col-md-6'"><label class="field-label">{{field.label}}{{field.required ? ' *' : ''}}</label><mat-form-field appearance="outline" class="w-100" *ngIf="!field.type || ['text','email','number','date'].includes(field.type)"><input matInput [type]="field.type || 'text'" [formControlName]="field.key"><mat-error>{{field.label}} is required</mat-error><mat-hint *ngIf="field.hint">{{field.hint}}</mat-hint></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'select'"><mat-select [formControlName]="field.key"><mat-option *ngFor="let option of field.options" [value]="option">{{option}}</mat-option></mat-select><mat-error>{{field.label}} is required</mat-error></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'textarea'"><textarea matInput rows="3" [formControlName]="field.key"></textarea></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'tags'"><input matInput [formControlName]="field.key" placeholder="Separate items with commas"><mat-hint>Use commas between values</mat-hint></mat-form-field><input *ngIf="field.type === 'file'" class="file-input" type="file" (change)="fileChange(field, $event)"></div></form></mat-dialog-content><mat-dialog-actions class="dialog-actions" align="end"><button mat-button mat-dialog-close>{{data.readonly ? 'Close' : 'Cancel'}}</button><button mat-flat-button color="primary" *ngIf="!data.readonly" (click)="save()">{{data.submitLabel}}</button></mat-dialog-actions>
