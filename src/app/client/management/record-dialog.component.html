<h2 mat-dialog-title class="dialog-title">{{data.title}}</h2><p class="dialog-subtitle">Enter the details below.</p><mat-dialog-content class="dialog-content"><form [formGroup]="form" class="row g-2"><div *ngFor="let field of data.fields" [ngClass]="field.type === 'textarea' || field.type === 'multiselect' ? 'col-12' : 'col-md-6'"><label class="field-label">{{field.label}}{{field.required ? ' *' : ''}}</label><mat-form-field appearance="outline" class="w-100" *ngIf="!field.type || ['text','email','phone','number','password'].includes(field.type)"><input matInput [type]="inputType(field)" [attr.inputmode]="isPhone(field) ? 'numeric' : null" [attr.maxlength]="isPhone(field) ? 10 : null" [placeholder]="placeholderFor(field)" [formControlName]="field.key" [attr.autocomplete]="field.type === 'password' ? 'new-password' : null"><button *ngIf="field.type === 'password'" mat-icon-button matSuffix type="button" (click)="shown[field.key] = !shown[field.key]" [attr.aria-label]="shown[field.key] ? 'Hide password' : 'Show password'"><mat-icon>{{shown[field.key] ? 'visibility' : 'visibility_off'}}</mat-icon></button><mat-error>{{errorFor(field)}}</mat-error><mat-hint *ngIf="field.hint">{{field.hint}}</mat-hint></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'time'"><input matInput class="time-input" readonly [ngxTimepicker]="timePicker" [format]="24" [formControlName]="field.key" [placeholder]="placeholderFor(field)"><ngx-material-timepicker-toggle matSuffix [for]="timePicker"></ngx-material-timepicker-toggle><ngx-material-timepicker #timePicker [enableKeyboardInput]="true"></ngx-material-timepicker><mat-error>{{errorFor(field)}}</mat-error><mat-hint *ngIf="field.hint">{{field.hint}}</mat-hint></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'date'"><input matInput [matDatepicker]="picker" [min]="minDate(field)" [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle><mat-datepicker #picker></mat-datepicker><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'select'"><mat-select [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-option *ngFor="let option of field.options" [value]="option">{{option}}</mat-option></mat-select><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><app-multi-select *ngIf="field.type === 'multiselect'" [formControlName]="field.key" [options]="field.options || []" [placeholder]="placeholderFor(field)" [searchPlaceholder]="'Search ' + field.label.toLowerCase()" [error]="errorFor(field)"></app-multi-select><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'textarea'"><textarea matInput rows="3" [formControlName]="field.key" [placeholder]="placeholderFor(field)"></textarea><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'tags'"><input matInput [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-hint>Use commas between values</mat-hint><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><ng-container *ngIf="field.type === 'file'"><input class="file-input" type="file" [attr.accept]="field.accept || null" [disabled]="!!data.readonly" (change)="fileChange(field, $event)"><small class="field-help d-block" *ngIf="currentFile(field)">Current: {{ currentFile(field) }}</small><small class="field-help d-block" *ngIf="field.hint">{{ field.hint }}</small></ng-container></div></form></mat-dialog-content><mat-dialog-actions class="dialog-actions" align="end"><button mat-button mat-dialog-close>{{data.readonly ? 'Close' : 'Cancel'}}</button><button mat-flat-button color="primary" *ngIf="!data.readonly" (click)="save()">{{data.submitLabel}}</button></mat-dialog-actions>
