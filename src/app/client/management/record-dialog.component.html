<h2 mat-dialog-title class="dialog-title">{{data.title}}</h2><p class="dialog-subtitle">Enter the details below. This demo saves changes locally in your browser session.</p><mat-dialog-content class="dialog-content"><form [formGroup]="form" class="row g-2"><div *ngFor="let field of data.fields" [ngClass]="field.type === 'textarea' || field.type === 'multiselect' ? 'col-12' : 'col-md-6'"><label class="field-label">{{field.label}}{{field.required ? ' *' : ''}}</label><mat-form-field appearance="outline" class="w-100" *ngIf="!field.type || ['text','email','phone','number'].includes(field.type)"><input matInput [type]="inputType(field)" [attr.inputmode]="isPhone(field) ? 'numeric' : null" [attr.maxlength]="isPhone(field) ? 10 : null" [placeholder]="placeholderFor(field)" [formControlName]="field.key"><mat-error>{{errorFor(field)}}</mat-error><mat-hint *ngIf="field.hint">{{field.hint}}</mat-hint></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'date'"><input matInput [matDatepicker]="picker" [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle><mat-datepicker #picker></mat-datepicker><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'select'"><mat-select [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-option *ngFor="let option of field.options" [value]="option">{{option}}</mat-option></mat-select><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><app-multi-select *ngIf="field.type === 'multiselect'" [formControlName]="field.key" [options]="field.options || []" [placeholder]="placeholderFor(field)" [searchPlaceholder]="'Search ' + field.label.toLowerCase()" [error]="errorFor(field)"></app-multi-select><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'textarea'"><textarea matInput rows="3" [formControlName]="field.key" [placeholder]="placeholderFor(field)"></textarea><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><mat-form-field appearance="outline" class="w-100" *ngIf="field.type === 'tags'"><input matInput [formControlName]="field.key" [placeholder]="placeholderFor(field)"><mat-hint>Use commas between values</mat-hint><mat-error>{{errorFor(field)}}</mat-error></mat-form-field><input *ngIf="field.type === 'file'" class="file-input" type="file" (change)="fileChange(field, $event)"></div></form></mat-dialog-content><mat-dialog-actions class="dialog-actions" align="end"><button mat-button mat-dialog-close>{{data.readonly ? 'Close' : 'Cancel'}}</button><button mat-flat-button color="primary" *ngIf="!data.readonly" (click)="save()">{{data.submitLabel}}</button></mat-dialog-actions>
